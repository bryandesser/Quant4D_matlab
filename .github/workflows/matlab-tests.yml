name: MATLAB tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }} / ${{ matrix.release }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        release: [ R2024b ]          # add the oldest release you support, e.g. R2023b

    steps:
      - uses: actions/checkout@v4

      # matlab.uitest needs a display; Windows runners have one, Linux gets Xvfb
      - name: Start virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # Free for public repositories; a private repo needs a MATLAB batch licensing token
      # (secrets.MLM_LICENSE_TOKEN), see the setup-matlab README.
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.release }}
          products: >
            Image_Processing_Toolbox
            Parallel_Computing_Toolbox

      - name: Run check + unit + integration tests
        uses: matlab-actions/run-build@v2
        with:
          tasks: test

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-results-${{ matrix.os }}-${{ matrix.release }}
          path: results/

  test-gpu:
    name: GPU tests (self-hosted)
    if: github.event_name == 'push'
    # needs a licensed MATLAB + Parallel Computing Toolbox on the runner
    runs-on: [ self-hosted, gpu, matlab ]
    steps:
      - uses: actions/checkout@v4
      - name: Run GPU tests
        uses: matlab-actions/run-build@v2
        with:
          tasks: testGPU
